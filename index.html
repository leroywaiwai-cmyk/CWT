<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AIA CWT 團隊 AI 提詞神器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f3f4f6;
            -ms-overflow-style: none;
            scrollbar-width: none;
            padding-bottom: 70px;
        }
        body::-webkit-scrollbar { display: none; }
        
        .view-section { display: none; animation: fadeIn 0.3s ease-in-out; }
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .prompt-box {
            background-color: #1e293b; color: #e2e8f0; font-family: 'Courier New', Courier, monospace;
            white-space: pre-wrap; border-radius: 12px; padding: 16px; font-size: 14px; line-height: 1.6;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }
        .variable-highlight { color: #fbbf24; font-weight: bold; }
        
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; background: white;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.05); display: flex; justify-content: space-around;
            padding-bottom: env(safe-area-inset-bottom); z-index: 50;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; padding: 10px 0;
            color: #94a3b8; flex: 1; font-size: 11px; transition: color 0.2s;
        }
        .nav-item.active { color: #d31145; font-weight: bold; } /* AIA Red */
        .nav-item i { font-size: 20px; margin-bottom: 4px; }

        #toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: #10b981; color: white; padding: 12px 24px; border-radius: 30px;
            font-size: 14px; font-weight: bold; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
            opacity: 0; transition: opacity 0.3s; z-index: 100; pointer-events: none;
        }
        #toast.show { opacity: 1; }

        /* AIA Specific Branding */
        .bg-aia-red { background-color: #d31145; }
        .text-aia-red { color: #d31145; }
        .border-aia-red { border-color: #d31145; }
    </style>
</head>
<body class="text-slate-800">

                <i class="fa-solid fa-users-viewfinder"></i>
            </div>

            <div class="text-left bg-slate-50 p-5 rounded-xl border border-slate-100 text-sm text-slate-700 space-y-3">

    <div id="toast"><i class="fa-solid fa-check-circle mr-2"></i> <span id="ui-toast-msg">已複製！</span></div>

                                template: "Compare two products for my client:\n【AIA Product】{productA}\n【Competitor】{productB}\n\nAct as a neutral expert from the CWT Team:\n1. Objectively state features.\n2. Highlight AIA's advantage in {advantage}.\n3. Give a final recommendation based on client needs.",
                                fields: [ { id: "productA", label: "AIA Product", val: "Protect Elite Ultra 2" }, { id: "productB", label: "Competitor", val: "A generic market CI plan" }, { id: "advantage", label: "AIA Advantage", val: "Multi-claims and Dementia cover" } ] },
                            { id: "m10", title: "Proposal Copywriting", desc: "Translate data into warm words", icon: "fa-solid fa-file-pen",
                                template: "Here is the data for an AIA proposal:\n【Product: {product}】\n【Data: {data}】\n\nWrite a 1-page 'Executive Summary'.\n1. Translate cold data into warm 'life scenarios' (e.g. legacy, education).\n2. Avoid jargon.\n3. Use bullet points for the 3 core values.",
                                fields: [ { id: "product", label: "AIA Product", val: "Global Power Multi-Currency Plan 3" }, { id: "data", label: "Proposal Data", val: "5-yr pay, 100k/yr. Unlimited changes of insured & currency." } ] },
                            { id: "m11", title: "Infographic Script", desc: "Short copy for visual design", icon: "fa-regular fa-image",
                                template: "I need to make a mobile infographic for the 【{product}】 plan.\n\nProvide extremely concise copy:\nSection 1 (Why): 1 sentence on the necessity.\nSection 2 (How): 3 bullet points on core mechanics.\nSection 3 (When): Timeline highlight.\nSection 4 (CTA): A call to action with CWT Team contact info.",
                                fields: [ { id: "product", label: "AIA Product", val: "VHIS VIP Plan" } ] }
                        ]
                    },
                    {
                        category: "Phase 5: Review & After-Sales", color: "text-purple-600", bg: "bg-purple-100",
                        items: [
                            { id: "m14", title: "Annual Policy Review", desc: "Review and Up-sell", icon: "fa-solid fa-magnifying-glass-chart",
                                template: "Client's policy is at its anniversary. Current policy: {policies}\n\nDraft:\n1. A warm opening (report CWT Team services & AIA dividends).\n2. A natural transition to discuss 【{newProduct}】 to address {newNeed}.",
                                fields: [ { id: "policies", label: "Current Policy", val: "An old small-sum CI plan" }, { id: "newProduct", label: "Recommend AIA", val: "Protect Elite 2" }, { id: "newNeed", label: "New Need", val: "Inflation eroding coverage" } ] },
                            { id: "m15", title: "Family Policy Review", desc: "Expand to spouse/kids or trust", icon: "fa-solid fa-house-chimney-medical",
                                template: "Client is a {client} with only personal coverage. I want to do a 'Family Risk Check' for the CWT Team.\n\nProvide a 'Family Wealth Questionnaire' (4 questions):\nGuide them to think about:\n1. Spouse's medical cover (Introduce {product1})\n2. Kids' education fund (Introduce {product2})\nKeep it professional and tactful.",
                                fields: [ { id: "client", label: "Client Profile", val: "45yo executive" }, { id: "product1", label: "AIA Medical", val: "AIA High-end Medical" }, { id: "product2", label: "AIA Savings", val: "Global Power Multi-Currency 3" } ] }
                        ]
                    }
                ]
            }
        };

        // === State ===
        let currentLang = 'zh-HK';
        let currentModule = null;

        // === DOM Elements ===
        const els = {
            langSelect: document.getElementById('langSelect'),
            moduleListContainer: document.getElementById('moduleListContainer'),
            formContainer: document.getElementById('formContainer'),
            promptPreview: document.getElementById('promptPreview'),
            backBtn: document.getElementById('backBtn'),
            views: document.querySelectorAll('.view-section'),
            navItems: document.querySelectorAll('.nav-item'),
            copyBtn: document.getElementById('copyBtn'),
            toast: document.getElementById('toast'),
            // UI Text Elements
            uiAppTitle: document.getElementById('ui-app-title'),
            uiStep1: document.getElementById('ui-step1-title'),
            uiStep2: document.getElementById('ui-step2-title'),
            uiBtnCopy: document.getElementById('ui-btn-copy'),
            uiNavModules: document.getElementById('ui-nav-modules'),
            uiNavAbout: document.getElementById('ui-nav-about'),
            uiTipsTitle: document.getElementById('ui-tips-title'),
            uiTipsContent: document.getElementById('ui-tips-content'),
            uiToastMsg: document.getElementById('ui-toast-msg'),
            // Active Module Elements
            activeModuleTitle: document.getElementById('activeModuleTitle'),
            activeModuleDesc: document.getElementById('activeModuleDesc'),
            activeModuleIcon: document.getElementById('activeModuleIcon')
        };

        // === Core Functions ===

        // 1. Change Language and Update UI completely
        function setLanguage(lang) {
            currentLang = lang;
            const data = i18n[lang];
            
            // Update static UI text
            els.uiAppTitle.innerText = data.ui.appTitle;
            els.uiStep1.innerText = data.ui.step1;
            els.uiStep2.innerText = data.ui.step2;
            els.uiBtnCopy.innerText = data.ui.btnCopy;
            els.uiNavModules.innerText = data.ui.navModules;
            els.uiNavAbout.innerText = data.ui.navAbout;
            els.uiTipsTitle.innerText = data.ui.tipsTitle;
            els.uiTipsContent.innerHTML = data.ui.tipsContent;
            els.uiToastMsg.innerText = data.ui.toast;

            // Re-render Module List
            renderList();

            // If a module is currently open, refresh its content in the new language
            if (currentModule) {
                openModule(currentModule.id); 
            }
        }

        // 2. Render the Home List
        function renderList() {
            const db = i18n[currentLang].db;
            let html = '';
            db.forEach(cat => {
                html += `<div class="mb-5">
                            <h3 class="text-xs font-bold text-slate-500 mb-2.5 px-2 tracking-wide">${cat.category}</h3>
                            <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">`;
                cat.items.forEach((item, index) => {
                    const borderClass = index === cat.items.length - 1 ? '' : 'border-b border-slate-100';
                    html += `
                        <div onclick="openModule('${item.id}')" class="p-4 flex items-center active:bg-red-50 transition-colors ${borderClass}">
                            <div class="w-11 h-11 rounded-xl ${cat.bg} ${cat.color} flex items-center justify-center mr-4 shrink-0 shadow-inner">
                                <i class="${item.icon} text-xl"></i>
                            </div>
                            <div class="flex-1">
                                <h4 class="font-bold text-slate-800 text-[15px]">${item.title}</h4>
                                <p class="text-[11px] text-slate-500 mt-0.5 line-clamp-1">${item.desc}</p>
                            </div>
                            <i class="fa-solid fa-chevron-right text-slate-300 text-sm ml-2"></i>
                        </div>`;
                });
                html += `</div></div>`;
            });
            els.moduleListContainer.innerHTML = html;
        }

        // 3. Open a specific Module
        window.openModule = (id) => {
            const db = i18n[currentLang].db;
            // Find module data in current language
            for(let cat of db) {
                const found = cat.items.find(i => i.id === id);
                if(found) { 
                    currentModule = found; 
                    currentModule.catColor = cat.color;
                    currentModule.catBg = cat.bg;
                    break; 
                }
            }
            if(!currentModule) return;

            // Set Headers
            els.activeModuleTitle.innerText = currentModule.title;
            els.activeModuleDesc.innerText = currentModule.desc;
            els.activeModuleIcon.className = `w-12 h-12 rounded-xl flex items-center justify-center mr-4 text-2xl shrink-0 ${currentModule.catBg} ${currentModule.catColor}`;
            els.activeModuleIcon.innerHTML = `<i class="${currentModule.icon}"></i>`;

            // Build Form
            let formHtml = '';
            currentModule.fields.forEach(f => {
                formHtml += `
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1.5 ml-1">${f.label}</label>
                        <textarea id="input_${f.id}" rows="2" oninput="updatePreview()"
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-[14px] focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 focus:bg-white transition-all resize-none">${f.val}</textarea>
                    </div>`;
            });
            els.formContainer.innerHTML = formHtml;

            switchView('view-form');
            els.backBtn.classList.remove('hidden');
            els.navItems.forEach(nav => nav.classList.remove('active'));

            updatePreview(); // Initial preview generation
        };

        // 4. Update Preview text in real-time
        window.updatePreview = () => {
            if(!currentModule) return;
            let finalPrompt = currentModule.template;
            
            currentModule.fields.forEach(f => {
                const inputEl = document.getElementById(`input_${f.id}`);
                const val = inputEl ? inputEl.value : '';
                const regex = new RegExp(`{${f.id}}`, 'g');
                finalPrompt = finalPrompt.replace(regex, `<span class="variable-highlight">${val || '___'}</span>`);
            });
            
            els.promptPreview.innerHTML = finalPrompt;
        };

        // 5. Switch Views (List / Form / Settings)
        function switchView(viewId) {
            els.views.forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            window.scrollTo(0, 0);
        }

        // === Event Listeners ===
        els.langSelect.addEventListener('change', (e) => {
            setLanguage(e.target.value);
        });

        els.backBtn.addEventListener('click', () => {
            switchView('view-list');
            els.backBtn.classList.add('hidden');
            document.getElementById('nav-home').classList.add('active');
        });

        els.navItems.forEach(item => {
            item.addEventListener('click', function() {
                const target = this.getAttribute('data-target');
                els.navItems.forEach(n => n.classList.remove('active'));
                this.classList.add('active');
                switchView(target);
                els.backBtn.classList.add('hidden');
            });
        });

        els.copyBtn.addEventListener('click', function() {
            const textToCopy = els.promptPreview.innerText || els.promptPreview.textContent;
            navigator.clipboard.writeText(textToCopy).then(() => {
                els.toast.classList.add('show');
                const btn = this;
                const originalHtml = btn.innerHTML;
                
                // Visual feedback using current language string
                const successMsg = currentLang === 'en' ? "Copied!" : "複製成功！";
                btn.innerHTML = `<i class="fa-solid fa-check text-lg mr-2"></i> ${successMsg}`;
                btn.classList.replace('bg-aia-red', 'bg-emerald-500');
                btn.classList.replace('hover:bg-red-600', 'hover:bg-emerald-400');
                
                setTimeout(() => {
                    els.toast.classList.remove('show');
                    btn.innerHTML = originalHtml;
                    btn.classList.replace('bg-emerald-500', 'bg-aia-red');
                    btn.classList.replace('hover:bg-emerald-400', 'hover:bg-red-600');
                }, 2000);
            }).catch(err => {
                alert(currentLang === 'en' ? 'Copy failed, please select text manually.' : '複製失敗，請長按文字手動複製。');
            });
        });

        // === Initialize App ===
        setLanguage('zh-HK');

    </script>
</body>
</html>
